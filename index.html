<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
  <meta name="theme-color" content="#6E8C52"/>
  <title>NPC办事处</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    /* 启动遮挡，避免首屏闪烁 */
    .splash{position:fixed;inset:0;background:#F7E9CC;display:flex;align-items:center;justify-content:center;color:#6E8C52;font-size:22px;font-weight:700;z-index:9999}
  </style>
</head>
<body>
  <div class="splash" id="splash">🌿 NPC办事处</div>
  <div class="app">
    <main id="view"></main>
  </div>
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <script type="module" src="js/app.js"></script>
  <script>
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }
    window.addEventListener('load', () => setTimeout(()=>{ const s=document.getElementById('splash'); if(s) s.remove(); },300));
  </script>
</body>
</html>
